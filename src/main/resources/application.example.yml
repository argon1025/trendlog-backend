server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3310/trendlog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: trendlog
    password: trendlog
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# 한국투자증권 OpenAPI 홈페이지에서 발급받은 값으로 채운다
kis:
  app-key: your-app-key
  app-secret: your-app-secret
