services:
  mysql:
    image: mysql:8.4
    container_name: trendlog-mysql
    restart: unless-stopped
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: trendlog
      MYSQL_DATABASE: trendlog
      MYSQL_USER: trendlog
      MYSQL_PASSWORD: trendlog
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - ./data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
